name: Analyze Scan Results

on:
  push:
    paths:
      - "data/market_scan_results.json"
      - "scripts/analyze_scan_results.py"
      - ".github/workflows/analyze_scan.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze-scan-main
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze latest scan
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python scripts/analyze_scan_results.py

      - name: Save structure report and chip watchlist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/scan_report.json data/electronic_watchlist.json
          git diff --cached --quiet || git commit -m "Update scan analysis report"

          git pull --rebase origin main
          git push
