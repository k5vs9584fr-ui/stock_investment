name: Analyze Scan Results

on:
  push:
    paths:
      - "scripts/analyze_scan_results.py"
      - "scripts/chip_confirm.py"
      - "scripts/chip_refine.py"
      - "scripts/chip_finalize.py"
      - ".github/workflows/analyze_scan.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze-scan-main
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2" pandas pyarrow requests

      - name: Analyze latest scan
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python scripts/analyze_scan_results.py

      - name: Run chip confirmation
        env:
          FINMIND_API_KEY: ${{ secrets.FINMIND_API_KEY }}
        run: python scripts/chip_confirm.py

      - name: Run full chip refinement
        env:
          FINMIND_API_KEY: ${{ secrets.FINMIND_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/chip_refine.py

      - name: Build complete final report
        run: python scripts/chip_finalize.py

      - name: Save report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/scan_report.json data/electronic_watchlist.json data/final_scan_results.json data/electronic_chip_results.json data/final_signal_report.json
          git diff --cached --quiet || git commit -m "Update scan analysis report"

          # The repo may advance while this analysis is running.
          # Rebase the generated report commit on top of the latest main before pushing.
          git pull --rebase origin main
          git push
