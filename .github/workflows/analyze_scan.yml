name: Analyze Scan Results

on:
  push:
    paths:
      - "scripts/analyze_scan_results.py"
      - "data/market_scan_results.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze latest scan
        run: python scripts/analyze_scan_results.py

      - name: Save report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/scan_report.json
          git diff --cached --quiet || git commit -m "Update scan analysis report"
          git push
