name: Realtime Stock Scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan entire Taiwan market
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          for batch in $(seq 1 50)
          do
            echo "======================================"
            echo "START BATCH $batch"
            echo "======================================"

            SCAN_BATCH=$batch python scripts/realtime_scan.py

            echo "FINISH BATCH $batch"
          done

      - name: Save scan results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/market_scan_results.json

          git diff --cached --quiet || git commit -m "Update full market scan"

          git push
