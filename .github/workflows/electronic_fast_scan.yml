name: Electronic Fast Scan

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/electronic_fast_scan.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run electronic fast scan
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python scripts/electronic_fast_scan.py

      - name: Save fast results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/electronic_fast_results.json
          git diff --cached --quiet || git commit -m "Update electronic fast scan"
          git push
