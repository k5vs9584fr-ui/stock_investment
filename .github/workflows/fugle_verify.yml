name: Verify Fugle API

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Fugle
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          key = os.environ["FUGLE_API_KEY"]
          url = "https://api.fugle.tw/marketdata/v1.0/stock/intraday/quote/2330"

          req = urllib.request.Request(
              url,
              headers={"X-API-KEY": key}
          )

          with urllib.request.urlopen(req, timeout=20) as resp:
              data = json.load(resp)

          print("FUGLE_VERIFY_OK")
          print("symbol:", data.get("symbol"))
          print("name:", data.get("name"))
          print("closePrice:", data.get("closePrice"))
          PY
