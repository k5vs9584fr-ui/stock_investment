name: Official EOD Full Market Radar

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/official_eod_radar.py'
      - 'tests/test_official_eod_radar.py'
      - '.github/workflows/official_eod_radar.yml'
  schedule:
    # Official TWSE end-of-day feed may lag until evening.
    # 20:35 Taipei and 07:45 Taipei next trading morning (UTC prior day).
    - cron: "35 12 * * 1-5"
    - cron: "45 23 * * 0-4"

permissions:
  contents: write

concurrency:
  group: official-eod-radar
  cancel-in-progress: false

jobs:
  market-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline parsing and freshness tests
        run: python -m unittest discover -s tests -p 'test_official_eod_radar.py' -v
      - name: Offline risk-first ranking tests
        run: python -m unittest discover -s tests -p 'test_risk_first_radar.py' -v
      - name: Test EOD signal journal
        run: python -m unittest discover -s tests -p 'test_eod_signal_journal.py' -v
      - name: Verify both official exchanges and scan all eligible stocks
        run: python scripts/official_eod_radar.py
      - name: Record research-only forward outcomes
        if: github.ref == 'refs/heads/main'
        run: python scripts/eod_signal_journal.py
      - name: Aggregate matured research outcomes
        if: github.ref == 'refs/heads/main'
        run: python scripts/eod_journal_report.py
      - name: Persist result or explicit failure state
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/official_eod_radar.json
          if [ -f data/eod_signal_journal.json ]; then git add data/eod_signal_journal.json; fi
          if [ -f data/eod_signal_report.json ]; then git add data/eod_signal_report.json; fi
          git diff --cached --quiet || git commit -m "Update official EOD radar status"
          git pull --rebase -X theirs origin main
          git push
