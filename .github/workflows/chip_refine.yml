name: Chip Refine

on:
  workflow_dispatch:
  push:
    paths:
      - "data/electronic_watchlist.json"
      - "scripts/chip_refine.py"
      - ".github/workflows/chip_refine.yml"

permissions:
  contents: write

concurrency:
  group: chip-refine-v2
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      FINMIND_API_KEY: ${{ secrets.FINMIND_API_KEY }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run fast chip confirmation
        run: python scripts/chip_confirm.py

      - name: Run full chip refinement
        run: python scripts/chip_refine.py

      - name: Run final ranking
        run: python scripts/chip_finalize.py

      - name: Save final signal report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/final_signal_report.json data/electronic_chip_results.json data/final_scan_results.json data/electronic_final_watchlist.json
          git diff --cached --quiet || git commit -m "Update final chip-refined signals"

          # 其他分析 workflow 可能同時更新 main；先把最新遠端變更 rebase 進來，
          # 再推送，避免 non-fast-forward 導致整條籌碼流程判定失敗。
          for attempt in 1 2 3
          do
            git pull --rebase origin main || {
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            }

            if git push origin HEAD:main
            then
              echo "Push success on attempt $attempt"
              exit 0
            fi

            echo "Push conflict on attempt $attempt; retrying..."
            sleep $((attempt * 2))
          done

          echo "Failed to push after 3 attempts"
          exit 1
