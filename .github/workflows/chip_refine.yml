name: Chip Refine

on:
  workflow_dispatch:
  push:
    paths:
      - "data/electronic_watchlist.json"
      - "scripts/chip_refine.py"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run chip refinement
        run: python scripts/chip_refine.py

      - name: Save final signal report
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/final_signal_report.json
          git diff --cached --quiet || git commit -m "Update final chip-refined signals"
          git push
